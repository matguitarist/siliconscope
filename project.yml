# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
# (tools/release.sh regenerates it after bumping the version.)
name: SiliconScope
options:
  bundleIdPrefix: com.mathieu
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The log viewer the apps share (the Log page).
  LogKit:
    url: https://github.com/matguitarist/LogKit
    from: 0.6.0
  # Self-updates for the app (tools/release.sh publishes the appcast).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  SiliconScope:
    type: application
    platform: macOS
    sources:
      - path: SiliconScope
    dependencies:
      - package: LogKit
        product: LogKitUI
      - package: Sparkle
    # A locally ("ad-hoc") signed app with the hardened runtime can't load
    # separately signed frameworks (Sparkle) without this.
    entitlements:
      path: SiliconScope/SiliconScope.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: SiliconScope/Info.plist
      properties:
        CFBundleDisplayName: SiliconScope
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        # App updates (Sparkle): tools/release.sh publishes the zip on GitHub
        # Releases and the feed (appcast.xml) on the main branch. Updates stay
        # off until SUPublicEDKey is added here (generate_keys --account siliconscope).
        SUFeedURL: https://raw.githubusercontent.com/matguitarist/siliconscope/main/appcast.xml
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: SiliconScope
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieu.SiliconScope
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox: the app reads every app bundle and every process.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: YES
schemes:
  SiliconScope:
    build:
      targets:
        SiliconScope: all
    run:
      config: Debug
    archive:
      config: Release
